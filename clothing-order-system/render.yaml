# Render Blueprint — deploy the API as a Web Service (PostgreSQL / Prisma / Neon)
# Set these environment variables (secrets) in the Render dashboard:
#   DATABASE_URL   Neon PostgreSQL connection string (use the POOLED string;
#                  include ?sslmode=require). Neon requires SSL.
#   DIRECT_URL     optional Neon *unpooled* / direct connection string. Used only
#                  for `prisma migrate deploy`. If unset, start.js strips `-pooler`
#                  from DATABASE_URL. Pooled URLs cannot take Postgres advisory locks
#                  (Prisma P1002) and previously blocked the process from listening.
#   JWT_SECRET     long random string
#   API_PUBLIC_URL your Render service URL, e.g. https://clothing-order-api.onrender.com
#   CORS_ORIGIN    your Vercel URL (comma-separated if multiple)
#
# Build = install deps + generate the Prisma client (`npm run build` -> `prisma generate`).
# The backend is plain ESM JS and needs no transpile; the Prisma client is the only build artifact.
#
# IMPORTANT: Render's pre-deploy command is available only for PAID web services
# (https://render.com/docs/deploys#pre-deploy-command). This service uses plan: free,
# so `preDeployCommand` is ignored and the dashboard Pre-Deploy field is locked.
# Migrations run at start with a timeout so a hung advisory lock cannot keep
# the service from listening (see server/src/start.js).
#
# Node is pinned to 20 (LTS) via both NODE_VERSION below and server/.node-version.

services:
  - type: web
    name: clothing-order-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
